aid: flip
name: Flip
description: >-
  Flip (PT Fliptech Lentera Inspirasi Pertiwi) is an Indonesian financial
  technology company offering low-cost interbank money transfers, bill payments,
  and cross-border remittance to consumers, and a "Flip for Business" (bigflip)
  suite of payment APIs to companies. The Flip for Business API lets businesses
  disburse money to any Indonesian bank or e-wallet (Money Transfer /
  Disbursement API), accept online payments via bank transfer, virtual accounts,
  e-wallets, cards, and retail outlets (Accept Payment API), and send
  international transfers (International Transfer API). The API is HTTP Basic
  authenticated with a secret key, supports IP whitelisting, idempotency keys,
  and signed callbacks/webhooks, and ships a sandbox environment plus WooCommerce
  and Magento 2 payment plugins. Flip is backed by Insight Partners, Lightspeed
  Venture Partners, and Y Combinator.
