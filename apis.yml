apis:
- name: Flip Money Transfer (Disbursement) API
  description: >-
    Disburse money programmatically to any Indonesian bank account or e-wallet.
    Create single and bulk disbursements, inquire bank accounts, list bank codes,
    and receive callbacks on disbursement status. HTTP Basic auth with a secret
    key; supports idempotency keys and IP whitelisting.
  humanURL: https://docs.flip.id/
  baseURL: https://bigflip.id/api/v2
  tags:
  - Money Transfer
  - Disbursement
  - Bulk Disbursement
  - Bank Account Inquiry
  properties:
  - type: Documentation
    url: https://docs.flip.id/
- name: Flip Accept Payment API
  description: >-
    Accept online payments from customers via bank transfer, virtual accounts,
    e-wallets, cards, QRIS, and retail outlets. Create payment links / bills,
    configure payment methods and expiry, and receive payment callbacks.
  humanURL: https://docs.flip.id/
  baseURL: https://bigflip.id/api/v2
  tags:
  - Accept Payment
  - Payment Link
  - Virtual Account
  - Checkout
  properties:
  - type: Documentation
    url: https://docs.flip.id/
- name: Flip International Transfer API
  description: >-
    Send cross-border international transfers, including bulk international
    transfers, with recipient inquiry, request-for-information (RFI) handling,
    and transfer status callbacks.
  humanURL: https://docs.flip.id/
  baseURL: https://bigflip.id/api/v2
